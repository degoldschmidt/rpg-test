name: tests

on:
  push:
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: 4.5.1

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip

      - name: Quick suite
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tests/run.sh quick

      - name: Full suite
        if: github.event_name == 'pull_request'
        run: GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 tests/run.sh full
